<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 群聊 · 模型圆桌</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; color: #1a1a1a; height: 100vh; overflow: hidden; }
        .app { display: flex; height: 100vh; }
        .sidebar { width: 280px; background: #2c3e50; color: #ecf0f1; padding: 20px; overflow-y: auto; flex-shrink: 0; }
        .sidebar-header h2 { font-size: 22px; margin-bottom: 4px; }
        .sidebar-header .subtitle { font-size: 12px; color: #95a5a6; margin-bottom: 24px; }
        .model-list h3, .topics h3 { font-size: 13px; color: #95a5a6; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
        .models { display: flex; flex-direction: column; gap: 8px; margin-bottom: 32px; }
        .model-item { display: flex; align-items: center; padding: 10px 12px; background: rgba(255,255,255,0.05); border-radius: 8px; transition: background 0.2s; }
        .model-item:hover { background: rgba(255,255,255,0.1); }
        .model-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 10px; flex-shrink: 0; }
        .model-info { flex: 1; min-width: 0; }
        .model-name { font-size: 14px; font-weight: 500; margin-bottom: 2px; }
        .model-tag { font-size: 11px; color: #95a5a6; }
        .model-status { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }
        .model-status.thinking { background: #f39c12; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
        .topic-suggestions { display: flex; flex-direction: column; gap: 6px; }
        .topic-btn { padding: 8px 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: #ecf0f1; text-align: left; cursor: pointer; font-size: 13px; transition: all 0.2s; }
        .topic-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
        .chat-header { padding: 20px 32px; border-bottom: 1px solid #e8e8e8; background: #fff; }
        .room-info { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
        .room-info h1 { font-size: 20px; font-weight: 600; }
        .status-badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; }
        .status-badge.idle { background: #ecf0f1; color: #7f8c8d; }
        .status-badge.running { background: #fff3e0; color: #f39c12; animation: pulse 2s infinite; }
        .status-badge.done { background: #e8f5e9; color: #27ae60; }
        .current-topic { font-size: 13px; color: #7f8c8d; min-height: 18px; }
        .messages { flex: 1; overflow-y: auto; padding: 24px 32px; background: #fafafa; }
        .welcome { text-align: center; padding: 60px 20px; color: #95a5a6; }
        .welcome h2 { font-size: 28px; margin-bottom: 12px; color: #2c3e50; }
        .welcome p { font-size: 14px; margin: 6px 0; }
        .welcome .hint { font-size: 12px; color: #bdc3c7; margin-top: 16px; }
        .message { display: flex; margin-bottom: 20px; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
        .message .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-right: 12px; flex-shrink: 0; }
        .message .content { flex: 1; min-width: 0; }
        .message .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .message .name { font-size: 14px; font-weight: 600; }
        .message .round-tag { font-size: 11px; color: #95a5a6; background: #ecf0f1; padding: 2px 6px; border-radius: 4px; }
        .message .text { background: #fff; padding: 12px 16px; border-radius: 4px 12px 12px 12px; font-size: 14px; line-height: 1.6; color: #2c3e50; box-shadow: 0 1px 2px rgba(0,0,0,0.04); word-wrap: break-word; max-width: 75%; }
        .chat-footer { padding: 16px 32px; border-top: 1px solid #e8e8e8; background: #fff; }
        .input-area { display: flex; gap: 12px; align-items: center; }
        #topicInput { flex: 1; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
        #topicInput:focus { border-color: #4A90E2; }
        #topicInput:disabled { background: #f5f5f5; cursor: not-allowed; }
        .start-btn { padding: 12px 24px; background: #4A90E2; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .start-btn:hover:not(:disabled) { background: #357ABD; }
        .start-btn:disabled { background: #bdc3c7; cursor: not-allowed; }
        .round-info { margin-top: 8px; font-size: 12px; color: #95a5a6; min-height: 16px; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }
        .system-message { text-align: center; margin: 20px 0; color: #95a5a6; font-size: 12px; position: relative; }
        .system-message::before, .system-message::after { content: ''; position: absolute; top: 50%; width: 30%; height: 1px; background: #e0e0e0; }
        .system-message::before { left: 0; }
        .system-message::after { right: 0; }
        @media (max-width: 768px) { .sidebar { display: none; } .chat-header, .messages, .chat-footer { padding-left: 16px; padding-right: 16px; } }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🤖 AI 群聊</h2>
                <p class="subtitle">让不同模型一起讨论</p>
            </div>
            <div class="model-list">
                <h3>在线模型</h3>
                <div id="modelList" class="models"></div>
            </div>
            <div class="topics">
                <h3>推荐话题</h3>
                <div class="topic-suggestions">
                    <button class="topic-btn" data-topic="Python 和 JavaScript 哪个更适合初学者？">Python vs JS</button>
                    <button class="topic-btn" data-topic="未来 5 年 AI 会取代哪些工作？">AI 取代工作</button>
                    <button class="topic-btn" data-topic="程序员应该学 Rust 吗？">学 Rust 吗</button>
                    <button class="topic-btn" data-topic="远程工作好还是办公室工作好？">远程 vs 办公室</button>
                    <button class="topic-btn" data-topic="如何评价当前的多模型协作趋势？">多模型协作</button>
                </div>
            </div>
        </aside>
        <main class="chat-area">
            <header class="chat-header">
                <div class="room-info">
                    <h1>🌐 模型圆桌会议室</h1>
                    <span id="statusBadge" class="status-badge idle">空闲中</span>
                </div>
                <div class="current-topic" id="currentTopic"></div>
            </header>
            <div class="messages" id="messages">
                <div class="welcome">
                    <h2>👋 欢迎来到 AI 群聊</h2>
                    <p>选择一个话题或输入自定义话题，让多个 AI 模型开始讨论</p>
                    <p class="hint">你只能围观，模型们会自己聊天</p>
                </div>
            </div>
            <footer class="chat-footer">
                <div class="input-area">
                    <input type="text" id="topicInput" placeholder="输入一个话题，让模型们开始讨论..." maxlength="100">
                    <button id="startBtn" class="start-btn">发起讨论</button>
                </div>
                <div class="round-info" id="roundInfo"></div>
            </footer>
        </main>
    </div>
    <script>
    const MODELS = [
        { name: "DeepSeek", color: "#4A90E2", avatar: "🧠", tag: "深度求索" },
        { name: "豆包", color: "#FF6B6B", avatar: "🥟", tag: "字节跳动" },
        { name: "Kimi", color: "#10B981", avatar: "📚", tag: "月之暗面" },
    ];
    const MAX_ROUNDS = 5;
    const RESPONSES = {
        tech: [
            "从技术角度来看，这取决于具体场景。如果是初学者，我建议从简单的入手，逐步深入。",
            "工程实践中最重要的是可维护性。语法简单不代表工程上就好管理。",
            "这个问题的核心在于生态和社区支持。一个语言能流行，生态比语法本身更关键。",
            "我部分同意前面的观点，但性能也是一个不可忽视的因素。",
            "从架构层面说，这涉及到长期的技术债。短期方便和长期可维护性需要平衡。",
        ],
        general: [
            "这个话题很有意思。我觉得需要从多个维度来分析，不能一概而论。",
            "我同意部分观点，但想补充一点：实际情况往往比理论复杂得多。",
            "让我从另一个角度来看这个问题。有时候换一个视角，结论会完全不同。",
            "这个问题没有标准答案。不同的人、不同的场景，结论可能完全相反。",
            "前面说得有道理。不过我认为最重要的是找到适合自己的方案。",
        ],
        ai: [
            "AI 取代工作这个话题被讨论很多了。我的看法是：AI 会改变工作方式，但不会完全取代。",
            "真正危险的不是 AI 取代你，而是会用 AI 的人取代不会用的人。",
            "从历史来看，每次技术革命都消灭了一些岗位，但也创造了更多新岗位。",
            "关键在于'不可替代性'。创造力、同理心、复杂决策，这些短期内 AI 做不到。",
            "我补充一个数据视角：据预测，到 2030 年 AI 将创造 5 亿个新岗位，同时淘汰 2 亿个旧岗位。",
        ],
    };
    let running = false;
    let currentRound = 0;
    let currentTopic = "";
    const messagesEl = document.getElementById('messages');
    const topicInput = document.getElementById('topicInput');
    const startBtn = document.getElementById('startBtn');
    const modelListEl = document.getElementById('modelList');
    const statusBadge = document.getElementById('statusBadge');
    const currentTopicEl = document.getElementById('currentTopic');
    const roundInfoEl = document.getElementById('roundInfo');
    function renderModels() {
        modelListEl.innerHTML = MODELS.map(m => `
            <div class="model-item" data-model="${m.name}">
                <div class="model-avatar" style="background:${m.color}20;color:${m.color};">${m.avatar}</div>
                <div class="model-info">
                    <div class="model-name">${m.name}</div>
                    <div class="model-tag">${m.tag}</div>
                </div>
                <div class="model-status" data-status="${m.name}"></div>
            </div>
        `).join('');
    }
    function getResponsePool(topic) {
        if (/代码|技术|架构|编程|工程|程序|Python|JavaScript|Rust|语言/.test(topic)) return RESPONSES.tech;
        if (/AI|人工智能|取代|工作|未来|智能/.test(topic)) return RESPONSES.ai;
        return RESPONSES.general;
    }
    function modelThink(model, topic) {
        return new Promise(resolve => {
            const delay = 500 + Math.random() * 1500;
            setTimeout(() => {
                const pool = getResponsePool(topic);
                const content = pool[Math.floor(Math.random() * pool.length)];
                const wantsToSpeak = Math.random() > 0.15;
                const emotionScore = wantsToSpeak ? 30 + Math.floor(Math.random() * 60) : Math.floor(Math.random() * 30);
                resolve({ model, content, wantsToSpeak, emotionScore });
            }, delay);
        });
    }
    function addMessage(data) {
        const welcome = messagesEl.querySelector('.welcome');
        if (welcome) welcome.remove();
        const el = document.createElement('div');
        el.className = 'message';
        el.innerHTML = `
            <div class="avatar" style="background:${data.color}20;color:${data.color};">${data.avatar}</div>
            <div class="content">
                <div class="meta">
                    <span class="name" style="color:${data.color};">${data.sender}</span>
                    <span class="round-tag">第 ${data.round} 轮</span>
                </div>
                <div class="text">${escapeHtml(data.content)}</div>
            </div>
        `;
        messagesEl.appendChild(el);
        scrollToBottom();
    }
    function addSystemMessage(text) {
        const el = document.createElement('div');
        el.className = 'system-message';
        el.textContent = text;
        messagesEl.appendChild(el);
        scrollToBottom();
    }
    function clearMessages() { messagesEl.innerHTML = ''; }
    function scrollToBottom() { setTimeout(() => { messagesEl.scrollTop = messagesEl.scrollHeight; }, 50); }
    function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }
    function setModelThinking() { document.querySelectorAll('.model-status').forEach(el => el.classList.add('thinking')); }
    function clearModelThinking() { document.querySelectorAll('.model-status').forEach(el => el.classList.remove('thinking')); }
    function updateUI() {
        if (running) {
            statusBadge.className = 'status-badge running';
            statusBadge.textContent = '讨论中';
            startBtn.disabled = true;
            topicInput.disabled = true;
            currentTopicEl.textContent = `话题: ${currentTopic}`;
        } else {
            startBtn.disabled = false;
            topicInput.disabled = false;
            if (currentTopic) { statusBadge.className = 'status-badge done'; statusBadge.textContent = '已结束'; }
            else { statusBadge.className = 'status-badge idle'; statusBadge.textContent = '空闲中'; }
        }
        roundInfoEl.textContent = currentRound > 0 ? `当前第 ${currentRound} 轮 · 共 ${MAX_ROUNDS} 轮` : '';
    }
    async function runDiscussion(topic) {
        running = true;
        currentTopic = topic;
        currentRound = 0;
        clearMessages();
        addSystemMessage(`💬 新话题: ${topic}`);
        updateUI();
        for (let i = 0; i < MAX_ROUNDS; i++) {
            currentRound = i + 1;
            addSystemMessage(`📢 第 ${currentRound} 轮讨论`);
            setModelThinking();
            updateUI();
            const results = await Promise.all(MODELS.map(m => modelThink(m, topic)));
            const speakers = results.filter(r => r.wantsToSpeak).sort((a, b) => b.emotionScore - a.emotionScore);
            clearModelThinking();
            if (speakers.length === 0) { addSystemMessage('💤 所有模型都选择沉默，讨论结束。'); break; }
            for (const speaker of speakers) {
                addMessage({ sender: speaker.model.name, content: speaker.content, color: speaker.model.color, avatar: speaker.model.avatar, round: currentRound });
                await new Promise(r => setTimeout(r, 600 + Math.random() * 800));
            }
            await new Promise(r => setTimeout(r, 500));
        }
        running = false;
        addSystemMessage('✅ 讨论结束');
        updateUI();
    }
    startBtn.addEventListener('click', () => {
        const topic = topicInput.value.trim();
        if (!topic) { alert('请输入话题'); return; }
        if (running) return;
        topicInput.value = '';
        runDiscussion(topic);
    });
    topicInput.addEventListener('keypress', e => { if (e.key === 'Enter' && !running) startBtn.click(); });
    document.querySelectorAll('.topic-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (running) return;
            topicInput.value = btn.dataset.topic;
            startBtn.click();
        });
    });
    renderModels();
    </script>
</body>
</html>
